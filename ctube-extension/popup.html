<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><title>CTube for YouTube</title>
<style>
:root{--paper:#f6f8fc;--card:#fff;--ink:#17202a;--soft:#5b6673;--line:#dde2e7;--red:#c8312b;--blue:#1f3a93;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0f1317;--card:#161b21;--ink:#e7ebee;--soft:#9aa5b1;--line:#2a323b;--red:#ff6a5c;--blue:#7f9cff;color-scheme:dark}}
body{margin:0;width:300px;background:var(--paper);color:var(--ink);font:14px/1.4 "Atkinson Hyperlegible",system-ui,sans-serif}
.air{height:5px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,transparent 12px 18px,var(--blue) 18px 30px,transparent 30px 36px)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
header img{width:32px;height:32px}
h1{font-size:16px;margin:0}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--soft)}
.card{background:var(--card);margin:8px 12px;border-radius:14px;padding:4px 0}
label{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer}
label+label{border-top:1px solid var(--line)}
label span{flex:1}
label small{display:block;color:var(--soft);font-size:12px}
input[type=checkbox]{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
input[type=checkbox]:checked{background:var(--red)}
input[type=checkbox]:checked::after{left:19px}
input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h2{font-size:12px;color:var(--soft);margin:12px 16px 0;font-weight:700}
.links{display:flex;gap:8px;padding:6px 12px 4px}
.links a{flex:1;text-align:center;background:var(--card);color:var(--ink);text-decoration:none;border-radius:999px;padding:8px;font-weight:700;border:1px solid var(--line)}
.links a:hover{border-color:var(--red)}
p.fine{font-size:11px;color:var(--soft);margin:8px 16px 12px}
</style></head>
<body>
<div class="air"></div>
<header><img src="icon48.png" alt=""><h1>CTube for YouTube<small>A Chausima look for YouTube</small></h1></header>
<div class="card">
  <label><span>Chausima look<small>Colours, rounder cards, airmail stripe</small></span><input type="checkbox" id="look"></label>
</div>
<h2>Focus mode for schoolwork</h2>
<div class="card">
  <label><span>Hide Shorts</span><input type="checkbox" id="noShorts"></label>
  <label><span>Hide comments</span><input type="checkbox" id="noComments"></label>
  <label><span>Hide recommendations<small>Empty home page, nothing next to videos</small></span><input type="checkbox" id="noRecs"></label>
</div>
<div class="links"><a href="https://chausima.com/ctube/" target="_blank">CTube</a><a href="https://chausima.com/" target="_blank">Chausima</a></div>
<p class="fine">Not made by, or connected with, YouTube or Google. YouTube is a trademark of Google LLC. CTube for YouTube only changes how YouTube looks in your own browser.</p>
<script src="popup.js"></script>
</body></html>
