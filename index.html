<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chausima</title>
<meta name="description" content="Chausima: search, the Chausima Suite, Mail, CTube and HWL Browser, with one Chausima Account.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<script src="/apps.js" defer></script>
<script src="/build-intro.js?b=20261118build"></script>
<style>
:root{
  --bg:#ffffff; --ink:#17245c; --text:#232838; --soft:#5f6680; --line:#e4e7f0; --well:#f3f5fa;
  --c1:#1f4fd8; --c2:#c8312b; --c3:#f2b705; --c4:#1f8a55; --c5:#7a4fd8;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#0f1424;--ink:#e9ecf8;--text:#e3e6f0;--soft:#a2a9c2;--line:#263050;--well:#18203a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 var(--body)}
a{color:inherit}
:focus-visible{outline:3px solid var(--c1);outline-offset:2px;border-radius:8px}
.top{display:flex;align-items:center;gap:6px;padding:12px 16px;font-size:.95rem}
.top a.lnk{padding:8px 10px;border-radius:999px;text-decoration:none;color:var(--soft)}
.top a.lnk:hover{color:var(--text);background:var(--well)}
.top .sp{flex:1}
.who{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;text-decoration:none;font-weight:700;color:var(--ink)}
.who i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;color:#fff;background:var(--c4);font-size:.85rem}
.who.out{padding:8px 16px;background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{max-width:720px;margin:0 auto;padding:0 16px}
.hero{min-height:calc(100vh - 150px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0 40px}
body.found .hero{min-height:0;padding:6px 0 10px;flex-direction:row;gap:16px;justify-content:flex-start}
.lockup{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);margin-bottom:28px}
.lockup svg{width:84px;height:84px;flex:none;overflow:visible}
.word{font:800 clamp(3rem,10vw,4.6rem)/1 var(--display);letter-spacing:-.045em;display:flex}
.word span{display:inline-block}
body.found .lockup{margin:0}
body.found .lockup svg{width:40px;height:40px}
body.found .word{font-size:1.9rem}

/* the one orchestrated moment: the C assembles from the apps' colours, then the name rises */
.arc{fill:none;stroke-width:11;stroke-linecap:round}
.dot{opacity:0;transform-box:fill-box;transform-origin:center}
.intro .arc{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .5s cubic-bezier(.3,.7,.2,1) forwards}
.intro .dot{animation:land .55s cubic-bezier(.2,.9,.25,1.2) forwards}
.intro .word span{opacity:0;transform:translateY(.35em);animation:rise .45s cubic-bezier(.2,.8,.2,1) forwards}
.intro .after{opacity:0;transform:translateY(10px);animation:rise .5s ease-out 1.25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes land{0%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.4)}60%{opacity:1}100%{opacity:0;transform:translate(0,0) scale(1)}}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.intro .arc,.intro .dot,.intro .word span,.intro .after{animation:none!important;opacity:1;stroke-dashoffset:0;transform:none}.intro .dot{opacity:0}}

form.sb{width:100%;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:6px 6px 6px 20px;background:var(--bg);box-shadow:0 1px 2px rgba(20,30,70,.06)}
form.sb:focus-within{border-color:var(--c1);box-shadow:0 2px 14px rgba(31,79,216,.14)}
form.sb svg{width:20px;height:20px;flex:none;stroke:var(--soft);fill:none;stroke-width:2}
form.sb input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);font:1.08rem var(--body);padding:10px 0}
.go{border:0;border-radius:999px;padding:11px 18px;font:700 .95rem var(--body);cursor:pointer;background:var(--ink);color:var(--bg)}
.ai{border:0;border-radius:999px;padding:11px 16px;font:700 .95rem var(--body);cursor:pointer;color:#fff;background:linear-gradient(120deg,var(--c1),var(--c5))}
body.found form.sb{max-width:620px}
@media (max-width:600px){body.found .hero{flex-direction:column;align-items:flex-start;gap:12px}}
.hint{color:var(--soft);font-size:.9rem;margin:12px 0 0;text-align:center}

.apps{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:34px;width:100%}
.apps a{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px;border-radius:16px;text-decoration:none;font-size:.88rem;color:var(--text);text-align:center}
.apps a:hover{background:var(--well)}
.apps i{width:48px;height:48px;border-radius:15px;display:grid;place-items:center}
.apps svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:560px){.apps{grid-template-columns:repeat(3,1fr)} .ai .long{display:none}}
body.found .apps,body.found .hint{display:none}

#res{display:none;padding:6px 0 60px}
body.found #res{display:block}
.rh{color:var(--soft);font-size:.92rem;margin:4px 0 6px}
.sec{font:700 1.02rem var(--display);color:var(--ink);margin:22px 0 4px}
.hit{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.hit b{display:block;color:var(--c1);font-size:1.1rem;font-weight:700}
.hit small{display:block;color:var(--c4);font-size:.82rem;margin:2px 0 3px;word-break:break-all}
.hit span{color:var(--soft);font-size:.95rem}
.aibox{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--well);border-radius:16px;padding:14px 16px;margin:10px 0 4px}
.aibox p{margin:0;font-weight:700;color:var(--ink)}

footer{text-align:center;color:var(--soft);font-size:.88rem;padding:20px 16px 28px}
footer a{color:var(--soft);margin:0 8px}
body.found footer{display:none}
</style>
</head>
<body>
<div class="top">
  <a class="lnk" href="https://about.chausima.com/">About</a>
  <div class="sp"></div>
  <span data-chausima-apps></span>
  <a class="who out" id="who" href="/account/">Sign in</a>
</div>

<main>
  <section class="hero" id="hero">
    <a class="lockup" href="/" aria-label="Chausima home" id="lockup">
      <svg viewBox="-50 -50 100 100" aria-hidden="true">
        <!-- five apps, five colours, one C -->
        <g transform="rotate(30)">
          <path class="arc" pathLength="100" stroke="var(--c1)" d="M 38 0 A 38 38 0 0 1 21.3 31.5" style="animation-delay:.25s"/>
          <path class="arc" pathLength="100" stroke="var(--c2)" d="M 14.2 35.2 A 38 38 0 0 1 -17.4 33.8" style="animation-delay:.37s"/>
          <path class="arc" pathLength="100" stroke="var(--c3)" d="M -24.4 29.1 A 38 38 0 0 1 -37.7 4.6" style="animation-delay:.49s"/>
          <path class="arc" pathLength="100" stroke="var(--c4)" d="M -37.0 -8.6 A 38 38 0 0 1 -20.7 -31.9" style="animation-delay:.61s"/>
          <path class="arc" pathLength="100" stroke="var(--c5)" d="M -13.0 -35.7 A 38 38 0 0 1 17.4 -33.8" style="animation-delay:.73s"/>
        </g>
        <circle class="dot" r="6" fill="var(--c1)" style="--fx:-160px;--fy:-90px;animation-delay:0s"/>
        <circle class="dot" r="6" fill="var(--c2)" style="--fx:150px;--fy:-110px;animation-delay:.06s"/>
        <circle class="dot" r="6" fill="var(--c3)" style="--fx:-140px;--fy:120px;animation-delay:.12s"/>
        <circle class="dot" r="6" fill="var(--c4)" style="--fx:170px;--fy:100px;animation-delay:.18s"/>
        <circle class="dot" r="6" fill="var(--c5)" style="--fx:0px;--fy:-170px;animation-delay:.24s"/>
      </svg>
      <span class="word" aria-label="chausima">
        <span style="animation-delay:.80s">c</span><span style="animation-delay:.85s">h</span><span style="animation-delay:.90s">a</span><span style="animation-delay:.95s">u</span><span style="animation-delay:1.00s">s</span><span style="animation-delay:1.05s">i</span><span style="animation-delay:1.10s">m</span><span style="animation-delay:1.15s">a</span>
      </span>
    </a>
    <div class="after" style="width:100%">
      <form class="sb" id="sb" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input type="search" id="q" name="q" placeholder="Search the web, safely" aria-label="Search" autocomplete="off" enterkeyhint="search">
        <button class="go" type="submit">Search</button>
        <button class="ai" type="button" id="ai">✨<span class="long"> AI Mode</span></button>
      </form>
      <p class="hint">Results come from HWL Search, our own list of school-friendly websites, plus videos and Wikipedia.</p>
      <nav class="apps" aria-label="Chausima apps" id="apps"></nav>
    </div>
  </section>

  <section id="res" aria-live="polite"></section>
</main>

<footer class="after">
  <a href="https://about.chausima.com/">About Chausima</a><a href="/account/">Chausima Account</a><a href="https://code.chausima.com/">Code</a>
  <div style="margin-top:6px">Made by HWL Systems</div>
</footer>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var hero = $("hero"), body = document.body;

  /* the build intro plays once per visit; any key or tap skips it */
  if (!location.search && window.BrandIntro) BrandIntro.play("home");

  var APPS = [
    ["Suite", "https://suite.chausima.com/", "var(--c4)", '<path d="M7 3.5h7l4 4V20.5H7z"/><path d="M14 3.5v4h4M9.5 12h6M9.5 15h6M9.5 18h4"/>'],
    ["Mail", "https://mail.chausima.com/", "var(--c2)", '<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M4.5 7l7.5 6 7.5-6"/>'],
    ["HWL AI", "https://hwlai.civilinitiatives.org/", "#3a3f8f", '<path d="M12 3.5l1.8 4.7 4.7 1.8-4.7 1.8L12 16.5l-1.8-4.7L5.5 10l4.7-1.8z"/>'],
    ["HWL Browser", "https://net.chausima.com/", "#d9408f", '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.6 5.4 3.6 8.5S14.5 17.9 12 20.5C9.5 17.9 8.4 15.1 8.4 12S9.5 6.1 12 3.5z"/>'],
    ["Account", "/account/", "var(--c5)", '<circle cx="12" cy="9" r="3.5"/><path d="M5 19.5c1.2-3.4 4-5 7-5s5.8 1.6 7 5"/>'],
    ["Launchpad", "https://civilinitiatives.org/", "var(--c1)", '<path d="M12 3c3 2.5 4 6 3.6 9.5H8.4C8 9 9 5.5 12 3z"/><path d="M8.6 12.5L6 16l3-.8M15.4 12.5L18 16l-3-.8"/>']
  ];
  $("apps").innerHTML = APPS.map(function (a) {
    return '<a href="' + a[1] + '"><i style="background:' + a[2] + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + a[3] + "</svg></i>" + a[0] + "</a>";
  }).join("");

  /* signed in with a Chausima Account? show their name */
  var tok = null; try { tok = localStorage.getItem("chz.session"); } catch (e) {}
  if (tok) fetch("https://hehs-live.duckdns.org/chausima-id/me", { method: "POST", headers: { Authorization: "Chausima " + tok, "content-type": "application/json" }, body: "{}" })
    .then(function (r) { return r.json(); }).then(function (j) {
      if (!j.ok) return; var w = $("who"), n = j.user.name || j.user.username;
      w.className = "who"; w.innerHTML = "<i></i>"; w.firstChild.textContent = n.charAt(0).toUpperCase(); w.appendChild(document.createTextNode(n.split(" ")[0]));
    }).catch(function () {});

  /* search: HWL Search (our own index), CTube videos and Wikipedia, side by side */
  function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function strip(h) { var d = document.createElement("div"); d.innerHTML = String(h || ""); return d.textContent; }
  function aiUrl(q) { return "https://hwlai.civilinitiatives.org/" + (q ? "#q=" + encodeURIComponent(q.slice(0, 500)) : ""); }
  function search(q) {
    body.classList.add("found"); body.classList.remove("intro");
    document.title = q + " - Chausima";
    var res = $("res"); res.innerHTML = '<div class="aibox"><p>Want an explained answer?</p><a class="ai" style="text-decoration:none" href="' + esc(aiUrl(q)) + '">✨ Ask in AI Mode</a></div><p class="rh">Searching…</p><div id="rw"></div><div id="rv"></div><div id="rk"></div>';
    var found = 0, done = 0;
    function fin() { if (++done < 3) return; res.querySelector(".rh").textContent = found ? "Results for “" + q + "”" : "Nothing found for “" + q + "”. Try different words, or ask in AI Mode."; }
    function sec(id, name) { var s = $(id); s.innerHTML = '<p class="sec">' + name + "</p>"; return s; }
    function hit(s, title, url, shown, about) { found++; var a = document.createElement("a"); a.className = "hit"; a.href = url;
      a.innerHTML = "<b>" + esc(title) + "</b><small>" + esc(shown) + "</small><span>" + esc(about) + "</span>"; s.appendChild(a); }
    fetch("https://hehs-live.duckdns.org/search/v1?query=" + encodeURIComponent(q) + "&maximumRecords=10").then(function (r) { return r.json(); }).then(function (j) {
      var items = ((j.channels || [])[0] || {}).items || [];
      if (items.length) { var s = sec("rw", "From the web"); items.forEach(function (it) { var sh = it.link.replace(/^https?:\/\//, "").slice(0, 70); hit(s, strip(it.title) || sh, it.link, sh, strip(it.description).slice(0, 200)); }); }
    }).catch(function () {}).then(fin);
    fetch("/ctube/feed.json").then(function (r) { return r.json(); }).then(function (f) {
      var words = q.toLowerCase().split(/\s+/).filter(function (w) { return w.length > 2; }), ch = {};
      (f.channels || []).forEach(function (c) { ch[c.id] = c.name; });
      var v = (f.videos || []).map(function (x) { var t = (x.t + " " + x.d).toLowerCase(), sc = 0; words.forEach(function (w) { if (t.indexOf(w) >= 0) sc += x.t.toLowerCase().indexOf(w) >= 0 ? 3 : 1; }); return [sc, x]; })
        .filter(function (x) { return x[0] > 0; }).sort(function (a, b) { return b[0] - a[0]; }).slice(0, 4);
      if (v.length) { var s = sec("rv", "Videos"); v.forEach(function (x) { hit(s, "▶ " + x[1].t, "https://www.youtube-nocookie.com/embed/" + x[1].id, (ch[x[1].c] || "YouTube") + " · YouTube", (x[1].d || "").slice(0, 140)); }); }
    }).catch(function () {}).then(fin);
    fetch("https://en.wikipedia.org/w/api.php?action=query&list=search&format=json&origin=*&srlimit=6&srsearch=" + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (j) {
      var h = (j.query && j.query.search) || [];
      if (h.length) { var s = sec("rk", "Wikipedia"); h.forEach(function (x) { hit(s, x.title, "https://en.m.wikipedia.org/wiki/" + encodeURIComponent(x.title.replace(/ /g, "_")), "en.wikipedia.org/wiki/" + x.title.replace(/ /g, "_"), strip(x.snippet) + "…"); }); }
    }).catch(function () {}).then(fin);
  }
  $("sb").addEventListener("submit", function (e) {
    e.preventDefault(); var q = $("q").value.trim(); if (!q) return;
    try { history.pushState(null, "", "?q=" + encodeURIComponent(q)); } catch (x) {}
    search(q);
  });
  $("ai").addEventListener("click", function () { location.href = aiUrl($("q").value.trim()); });
  function fromUrl() {
    var q = new URLSearchParams(location.search).get("q");
    if (q) { $("q").value = q; search(q); } else { body.classList.remove("found"); $("res").innerHTML = ""; document.title = "Chausima"; }
  }
  addEventListener("popstate", fromUrl); fromUrl();
})();
</script>
</body>
</html>
