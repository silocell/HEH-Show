name: CTube feed
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths: ["ctube/channels.json", "tools/ctube_feed.py"]
permissions:
  contents: write
concurrency: ctube-feed
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ctube_feed.py
      - name: Commit if the feed changed
        run: |
          git config user.name "CTube feed"
          git config user.email "ctube-feed@users.noreply.github.com"
          git add ctube/feed.json
          git diff --cached --quiet || (git commit -m "CTube: update video feed" && git push)
